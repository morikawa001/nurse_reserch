<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>看護研究アイデア ブラッシュアップAI</title>
  <style>
    :root {
      --primary: #1a6b8a; --primary-light: #e8f4f8; --accent: #2eaad1;
      --bg: #f4f7fa; --card: #ffffff; --text: #2d3748;
      --muted: #718096; --border: #e2e8f0; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Hiragino Sans","Meiryo",sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: linear-gradient(135deg,var(--primary),var(--accent)); color: white; padding: 24px 32px; display: flex; align-items: center; gap: 16px; }
    header .icon { font-size: 2rem; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    .container { max-width: 860px; margin: 32px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,.07); border: 1px solid var(--border); }
    .card h2 { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
    label:first-of-type { margin-top: 0; }
    input[type=text], textarea, select { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .95rem; font-family: inherit; color: var(--text); background: var(--bg); transition: border-color .2s; outline: none; }
    input[type=text]:focus, textarea:focus, select:focus { border-color: var(--accent); background: white; }
    textarea { resize: vertical; min-height: 90px; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .checkbox-group label { margin: 0; display: flex; align-items: center; gap: 6px; font-weight: 400; color: var(--text); cursor: pointer; background: var(--primary-light); padding: 6px 12px; border-radius: 20px; font-size: .88rem; transition: background .2s; }
    .checkbox-group label:hover { background: #cce9f5; }
    .checkbox-group input[type=checkbox] { accent-color: var(--primary); }
    .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg,var(--primary),var(--accent)); color: white; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .2s; }
    .btn-primary:hover { opacity: .92; }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .loading { display: none; align-items: center; justify-content: center; gap: 12px; padding: 20px; color: var(--muted); font-size: .9rem; }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #result { display: none; }

    /* ストリーミング表示エリア */
    #streamRaw { white-space: pre-wrap; font-family: inherit; font-size: .9rem; line-height: 1.7; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-height: 60px; display: none; }
    #streamRaw .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); animation: blink .7s step-end infinite; vertical-align: text-bottom; margin-left: 2px; }
    @keyframes blink { 50% { opacity: 0; } }

    /* 整形後の結果 */
    .result-content { line-height: 1.85; font-size: .95rem; }
    .result-content h3 { color: var(--primary); font-size: 1rem; font-weight: 700; margin: 20px 0 8px; padding: 6px 10px; background: var(--primary-light); border-left: 4px solid var(--accent); border-radius: 4px; }
    .result-content h3:first-child { margin-top: 0; }
    .result-content p { margin-bottom: 10px; }
    .result-content ul { padding-left: 22px; margin-bottom: 10px; }
    .result-content li { margin-bottom: 6px; }
    .result-content strong { color: var(--primary); }
    .result-content table { width: 100%; border-collapse: collapse; margin: 12px 0 16px; font-size: .9rem; }
    .result-content th { background: var(--primary-light); color: var(--primary); padding: 10px 14px; text-align: left; border: 1px solid var(--border); font-weight: 700; }
    .result-content td { padding: 10px 14px; border: 1px solid var(--border); vertical-align: top; }
    .result-content tr:nth-child(even) td { background: #fafcfe; }

    .status-bar { font-size: .8rem; color: var(--muted); margin-top: 8px; min-height: 20px; }
    .status-done { color: #276749; font-weight: 600; }
    .copy-btn { margin-top: 16px; padding: 8px 18px; background: var(--primary-light); color: var(--primary); border: 1.5px solid var(--primary); border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer; }
    .copy-btn:hover { background: #cce9f5; }
    .error-box { display: none; background: #fff5f5; border: 1.5px solid #fc8181; border-radius: 8px; padding: 14px; color: #c53030; font-size: .9rem; }
    .badge { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 2px 10px; border-radius: 12px; font-size: .78rem; font-weight: 600; margin-left: 8px; }
    @media(max-width:600px){ header{padding:18px 16px;} .card{padding:18px;} }
  </style>
</head>
<body>

<header>
  <div class="icon">&#x1F3E5;</div>
  <div>
    <h1>看護研究アイデア ブラッシュアップAI</h1>
    <p>Gemini AIがあなたの研究アイデアをPICO/PECOフレームワークで整理・改善提案します</p>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>&#x1F4DD; 研究アイデアを入力</h2>

    <label>研究テーマ（キーワード） <span style="color:red">*</span></label>
    <input type="text" id="theme" placeholder="例：術後患者の疼痛管理、認知症高齢者のせん妄予防" />

    <label>研究背景・動機（任意）</label>
    <textarea id="background" placeholder="例：病棟で術後せん妄の発生が多く、予防ケアの標準化が必要と感じている"></textarea>

    <label>想定する研究デザイン（任意）</label>
    <select id="design">
      <option value="">─ 選択してください ─</option>
      <option value="横断研究">横断研究（Cross-sectional study）</option>
      <option value="縦断研究・コホート研究">縦断研究・コホート研究</option>
      <option value="ケースコントロール研究">ケースコントロール研究</option>
      <option value="ランダム化比較試験（RCT）">ランダム化比較試験（RCT）</option>
      <option value="準実験研究">準実験研究</option>
      <option value="質的研究">質的研究（インタビュー・グラウンデッドセオリー等）</option>
      <option value="混合研究法">混合研究法（Mixed Methods）</option>
      <option value="文献レビュー・系統的レビュー">文献レビュー・系統的レビュー</option>
      <option value="未定">未定（AIに提案してほしい）</option>
    </select>

    <label>重点的に改善してほしい点（複数選択可）</label>
    <div class="checkbox-group">
      <label><input type="checkbox" value="PICO/PECOの整理"> PICO/PECOの整理</label>
      <label><input type="checkbox" value="研究目的の明確化"> 研究目的の明確化</label>
      <label><input type="checkbox" value="アウトカム指標の提案"> アウトカム指標の提案</label>
      <label><input type="checkbox" value="倫理的配慮"> 倫理的配慮</label>
      <label><input type="checkbox" value="研究デザインの適切性"> 研究デザインの適切性</label>
      <label><input type="checkbox" value="先行研究との差別化"> 先行研究との差別化</label>
      <label><input type="checkbox" value="データ収集方法"> データ収集方法</label>
      <label><input type="checkbox" value="統計解析方法の提案"> 統計解析方法の提案</label>
    </div>

    <label style="margin-top:18px">研究対象施設・部署（任意）</label>
    <input type="text" id="setting" placeholder="例：急性期病棟、外来化学療法室、ICU" />
  </div>

  <button class="btn-primary" id="generateBtn" onclick="generate()">
    &#x2728; AIでブラッシュアップする
  </button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    Gemini AIが生成中です（ストリーミング）...
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="card" id="result">
    <h2>&#x1F916; AIによる改善提案 <span class="badge">Gemini Stream</span></h2>

    <!-- ストリーミング中はここにリアルタイム表示 -->
    <div id="streamRaw"></div>

    <!-- 完了後に整形して表示 -->
    <div class="result-content" id="resultContent" style="display:none"></div>

    <div class="status-bar" id="statusBar"></div>
    <button class="copy-btn" id="copyBtn" style="display:none" onclick="copyResult()">&#x1F4CB; 結果をコピー</button>
  </div>

</div>

<script>
  // ★ 新しいAPIキーをここに入力
  // ★ GASのウェブアプリURLに変更（APIキーは不要）
const GAS_URL = "https://script.google.com/macros/s/AKfycbwFGWXonRPSDqhToxurlrxmvb0oMydOdM18_2Jy5aQWDXP60o6bKjkjYYfu741dgkqB/exec"; // ← STEPで取得したURLを貼る

  function getCheckedValues() {
    return Array.from(document.querySelectorAll('.checkbox-group input[type=checkbox]:checked'))
                .map(cb => cb.value);
  }

  async function generate() {
    const theme = document.getElementById('theme').value.trim();
    if (!theme) { alert('研究テーマを入力してください。'); return; }

    const background  = document.getElementById('background').value.trim();
    const design      = document.getElementById('design').value;
    const setting     = document.getElementById('setting').value.trim();
    const focusAreas  = getCheckedValues();

    const btn        = document.getElementById('generateBtn');
    const loading    = document.getElementById('loading');
    const result     = document.getElementById('result');
    const errorBox   = document.getElementById('errorBox');
    const streamRaw  = document.getElementById('streamRaw');
    const resultContent = document.getElementById('resultContent');
    const statusBar  = document.getElementById('statusBar');
    const copyBtn    = document.getElementById('copyBtn');

    btn.disabled = true;
    loading.style.display = 'flex';
    result.style.display  = 'none';
    errorBox.style.display = 'none';
    streamRaw.style.display = 'none';
    resultContent.style.display = 'none';
    copyBtn.style.display = 'none';
    statusBar.textContent = '';
    streamRaw.innerHTML   = '';
    resultContent.innerHTML = '';

    const prompt = buildPrompt(theme, background, design, setting, focusAreas);

    try {
      cconst response = await fetch(GAS_URL, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.5, topP: 0.9, maxOutputTokens: 8192 }
  })
});

  if (!response.ok) {
  const err = await response.json();
  throw new Error(err.error?.message || 'APIエラー: ' + response.status);
}

const data = await response.json();
const fullText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

if (!fullText) throw new Error('レスポンスが空です。GASのデプロイ設定を確認してください。');

// 完了後：整形して表示
loading.style.display   = 'none';
result.style.display    = 'block';
resultContent.innerHTML = markdownToHtml(fullText);
resultContent.style.display = 'block';
statusBar.innerHTML = '<span class="status-done">✅ 出力完了（' + fullText.length + '文字）</span>';
copyBtn.style.display = 'inline-block';
result.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (e) {
      loading.style.display  = 'none';
      result.style.display   = 'none';
      errorBox.textContent   = 'エラーが発生しました: ' + e.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  }

  function buildPrompt(theme, background, design, setting, focusAreas) {
    let p = 'あなたは看護研究の専門家です。以下の看護研究アイデアを分析し、改善提案を行ってください。\n\n';
    p += '## 入力情報\n';
    p += '- 研究テーマ: ' + theme + '\n';
    if (background)          p += '- 研究背景: ' + background + '\n';
    if (design)              p += '- 研究デザイン: ' + design + '\n';
    if (setting)             p += '- 対象部署: ' + setting + '\n';
    if (focusAreas.length)   p += '- 重点項目: ' + focusAreas.join('、') + '\n';
    p += '\n## 出力指示\n';
    p += '以下の9つのセクションを**すべて最後まで**出力してください。途中で終わらないよう、各セクションを簡潔にまとめてください。\n\n';
    p += '### 1. 研究テーマの評価\n意義・独自性・実施可能性を3文で評価。\n\n';
    p += '### 2. PICO/PECOフレーム整理\n| 要素 | 内容 |\n|------|------|\n| P（対象） | |\n| I/E（介入/曝露） | |\n| C（比較） | |\n| O（アウトカム） | |\n\n';
    p += '### 3. 推奨研究デザイン\n最適デザインと理由。代替案1つ。\n\n';
    p += '### 4. アウトカム指標の提案\n主要・副次アウトカムと既存尺度を箇条書き。\n\n';
    p += '### 5. データ収集方法\n具体的な手順とツールを箇条書き。\n\n';
    p += '### 6. 統計解析方法\n解析手法を箇条書き。\n\n';
    p += '### 7. 倫理的配慮\n主要な課題を3〜4点箇条書き。\n\n';
    p += '### 8. 改善・強化ポイント\n提案を3〜5点箇条書き。\n\n';
    p += '### 9. 文献検索キーワード\nPubMed用英語5個・医中誌用日本語5個。';
    return p;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function markdownToHtml(md) {
    const lines = md.split('\n');
    let html = '', tableRows = [], listItems = [];

    function flushList() {
      if (!listItems.length) return;
      html += '<ul>' + listItems.map(i => '<li>' + i + '</li>').join('') + '</ul>';
      listItems = [];
    }
    function flushTable() {
      if (!tableRows.length) return;
      let t = '<table>';
      tableRows.forEach((row, i) => {
        if (/^\|[-| ]+\|$/.test(row.trim())) return;
        const cells = row.trim().split('|').map(c => c.trim()).filter(c => c !== '');
        if (i === 0) t += '<thead><tr>' + cells.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
        else         t += '<tr>'        + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
      });
      t += '</tbody></table>';
      html += t;
      tableRows = [];
    }

    lines.forEach(line => {
      if (line.trim().startsWith('|')) {
        flushList();
        tableRows.push(line);
        return;
      }
      if (tableRows.length) flushTable();

      if      (line.startsWith('### ')) { flushList(); html += '<h3>' + inl(line.slice(4)) + '</h3>'; }
      else if (line.startsWith('## '))  { flushList(); html += '<h3>' + inl(line.slice(3)) + '</h3>'; }
      else if (/^[-*] /.test(line))     { listItems.push(inl(line.replace(/^[-*] /,''))); }
      else if (/^\d+\. /.test(line))    { listItems.push(inl(line.replace(/^\d+\. /,''))); }
      else if (line.trim() === '')      { flushList(); }
      else                              { flushList(); html += '<p>' + inl(line) + '</p>'; }
    });
    flushList(); flushTable();
    return html;
  }

  function inl(t) {
    return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
            .replace(/\*(.+?)\*/g,'<em>$1</em>');
  }

  function copyResult() {
    const text = document.getElementById('resultContent').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const b = document.getElementById('copyBtn');
      b.textContent = '✅ コピーしました！';
      setTimeout(() => { b.textContent = '📋 結果をコピー'; }, 2000);
    });
  }

  document.getElementById('theme').addEventListener('keydown', e => { if (e.key==='Enter') generate(); });
</script>
</body>
</html>
